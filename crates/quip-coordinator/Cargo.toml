[package]
name = "quip-coordinator"
version = "0.3.9-rc1"
edition = "2021"

[[bin]]
name = "quip-coordinator"
path = "src/main.rs"

[lib]
name = "quip_coordinator"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
quip-proto = "0.0.14"
quip-protocol = "0.0.14"
quantum-validation = { git = "https://gitlab.com/quip.network/quip-validator.git", tag = "v0.5.0", version = "0.5.0" }
quip-transaction-crypto = { git = "https://gitlab.com/quip.network/quip-validator.git", tag = "v0.5.0", version = "0.5.0" }
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive", "std"] }
sp-core = { git = "https://github.com/QuipNetwork/polkadot-sdk.git", tag = "v0.4.0", default-features = false, features = ["std"] }
sp-crypto-hashing = { git = "https://github.com/QuipNetwork/polkadot-sdk.git", tag = "v0.4.0", default-features = false, features = ["std"] }
blake2 = "0.10"
twox-hash = "1.6"
jsonrpsee = { version = "0.24", features = [
    "http-client",
    "ws-client",
    "client-ws-transport-tls",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Faucet auto-funding is a plain HTTPS POST with a JSON body. jsonrpsee only
# speaks JSON-RPC and hyper has no TLS layer wired here, so there is no existing
# client to reuse. rustls-tls keeps OpenSSL out of the slim runtime image and
# reuses the rustls already in Cargo.lock.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
tonic = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.8"
blake3 = "1"
# Pinned to the pallet's version so the decay projection matches the chain
# bit for bit. libm is pure Rust; std's f64::powf and f64::ln call the platform
# libm and may differ by an ulp, which the rounding turns into a milli.
libm = "=0.2.16"
getrandom = "0.2"
async-trait = "0.1"
# Stream type for RPC subscriptions. The transport trait returns a boxed
# stream so it stays object safe across native and WebAssembly builds.
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ising-generators = "0.0.14"

[dev-dependencies]
prost = { workspace = true }
tempfile = "3"
quantum-validation = { git = "https://gitlab.com/quip.network/quip-validator.git", tag = "v0.5.0", version = "0.5.0" }
quip-transaction-crypto = { git = "https://gitlab.com/quip.network/quip-validator.git", tag = "v0.5.0", version = "0.5.0" }
quip-transaction-crypto-core = { git = "https://gitlab.com/quip.network/quip-validator.git", tag = "v0.5.0", version = ">=0.1.0" }
quip-protocol = "0.0.14"
quip-proto = "0.0.14"
sp-core = { git = "https://github.com/QuipNetwork/polkadot-sdk.git", tag = "v0.4.0", default-features = false, features = ["std"] }
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive", "std"] }
jsonrpsee = { version = "0.24", features = ["ws-client", "client-ws-transport-tls", "macros"] }
blake2 = "0.10"
twox-hash = "1.6"
rand = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
quip-solver-conformance = "0.0.14"
quip-solver-core = "0.0.14"

[lints]
workspace = true
